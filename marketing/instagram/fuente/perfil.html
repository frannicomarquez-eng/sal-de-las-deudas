<html lang="es">

<title>Foto de perfil Brote</title>

  body { margin: 0; display: flex; gap: 40px; padding: 40px; background: #ddd; }
  .pf { width: 1080px; height: 1080px; display: flex; align-items: center; justify-content: center; }
  .pf img { width: 720px; margin-top: -20px; }
</style>

<body>
  <!-- Logo oficial (marca/brote/svg), sin reescribir. Verde de fondo, logo crema. -->

  <!-- Crema de fondo, logo verde. -->
  <section class="pf" data-shot="perfil-crema" style="background:#F6F2EA"><img src="../../../marca/brote/svg/brote-logo-sin-bajada.svg" alt="Brote"></section>
